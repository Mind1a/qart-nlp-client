<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password</title>
    <link rel="stylesheet" href="../styles/css/global.css" />
  </head>

  <body class="body">
    <div class="password_reset_container" id="container">
      <a href="../index.html" class="close_reset">
        <img src="../assets/images/svg/close_btn.svg" alt="" />
      </a>
      <div class="form_container sign_in" id="resolve">
        <form id="resetpassword_form" novalidate>
          <h2>პაროლის აღდგენა</h2>
          <label for="resolve_password" id="resetform_password_label"
            >ახალი პაროლი *</label
          >
          <div class="password">
            <input type="password" id="resolve_password" name="password" />
            <div id="resolve_password_toggleEye" class="eye_icon">
              <svg
                width="17"
                height="17"
                viewBox="0 0 17 17"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M16 8.33333C16 8.33333 13.2727 13 8.5 13C3.72727 13 1 8.33333 1 8.33333C1 8.33333 3.72727 4 8.5 4C13.2727 4 16 8.33333 16 8.33333Z"
                  stroke="#2C2C2C"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M8.5 11C9.88071 11 11 9.88071 11 8.5C11 7.11929 9.88071 6 8.5 6C7.11929 6 6 7.11929 6 8.5C6 9.88071 7.11929 11 8.5 11Z"
                  stroke="#2C2C2C"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <div class="slash"></div>
            </div>
          </div>
          <p class="error_message" id="reset_resetPassword_error_message"></p>
          <label for="reset_password" id="reset_password_label"
            >გაიმეორეთ პაროლი *</label
          >
          <div class="password">
            <input type="password" id="reset_password" name="password" />
            <div id="reset_password_toggleEye" class="eye_icon">
              <svg
                width="17"
                height="17"
                viewBox="0 0 17 17"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M16 8.33333C16 8.33333 13.2727 13 8.5 13C3.72727 13 1 8.33333 1 8.33333C1 8.33333 3.72727 4 8.5 4C13.2727 4 16 8.33333 16 8.33333Z"
                  stroke="#2C2C2C"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M8.5 11C9.88071 11 11 9.88071 11 8.5C11 7.11929 9.88071 6 8.5 6C7.11929 6 6 7.11929 6 8.5C6 9.88071 7.11929 11 8.5 11Z"
                  stroke="#2C2C2C"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <div class="slash"></div>
            </div>
          </div>
          <p class="error_message" id="reset_password_error_message"></p>
          <button type="submit" id="save">შენახვა</button>
        </form>
      </div>
      <div class="error_warning" id="error_warning">
        <img
          src="../assets/images/svg/error.svg"
          alt="error_warning"
          class="error_warning_img"
        />
        <h3>დაფიქსირდა შეცდომა ცადე თავიდან</h3>
        <button id="error_close">
          <img src="../assets/images/svg/error_close.svg" alt="error_close" />
        </button>
      </div>
    </div>

    <script src="../js/password_reset.js"></script>
  </body>
</html>
