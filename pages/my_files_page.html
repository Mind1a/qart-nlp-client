<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../styles/css/global.css" />
  </head>
  <body>
    <div class="layout">
      <div class="sidebar sidebar--collapsed">
        <div class="sidebar_header">
          <img
            class="sidebar_logoIcon"
            src="../assets/images/svg/MiniLogo.svg"
            alt="QartNLP"
          />
          <img
            class="sidebar_logoText"
            src="../assets/images/svg/LogoText.svg"
            alt="QartNLP"
          />
        </div>

        <div class="sidebar_divider"></div>

        <ul class="sidebar_nav">
          <li class="sidebar_navItem">
            <img
              class="sidebar_icon"
              src="../assets/images/svg/ProfileFileAdd.svg"
              alt=""
            />
            <span class="sidebar_label">ფაილის დამატება</span>
          </li>
          <li class="sidebar_navItem sidebar_navItem--active">
            <img
              class="sidebar_icon"
              src="../assets/images/svg/ProfileFiles.svg"
              alt=""
            />
            <span class="sidebar_label">ჩემი ფაილები</span>
          </li>
          <li class="sidebar_navItem">
            <img
              class="sidebar_icon"
              src="../assets/images/svg/Support.svg"
              alt=""
            />
            <span class="sidebar_label">კონტაქტი</span>
          </li>
        </ul>

        <div class="sidebar_footer">
          <div class="sidebar_avatar">ნ</div>
          <span class="sidebar_username">ნინი გოცირიძე</span>
        </div>
      </div>
      <div class="devider"></div>

      <main class="file-manager file-manager--empty">
        <p class="file-manager__title">ჩემი ფაილები</p>

        <nav class="file-manager__table-nav">
          <ul>
            <li>სახელი</li>
            <li>რედაქტირება</li>
            <li>ჩამოტვირთვა</li>
            <li>წაშლა</li>
          </ul>
        </nav>

        <div class="file-manager__empty-state">
          <img
            src="../assets/images/svg/file-upload-logo.svg"
            alt="file upload icon"
          />
          <p class="file-manager__empty-title">ფაილი ჯერ არ არის ატვირთული</p>
          <p class="file-manager__empty-subtitle">
            ატვირთეთ თქვენი პირველი ფაილი
          </p>
          <button class="file-manager__upload-btn">
            <img src="../assets/images/svg/upload.svg" alt="upload icon" />
            ფაილის ატვირთვა
          </button>
        </div>
      </main>

      <div class="botombar_box"></div>
      <div class="bottombar">
        <div class="bottombar_nav">
          <div class="bottombar_navItem">
            <img src="../assets/images/svg/fileaddbtm.svg" alt="" />
          </div>
          <div class="bottombar_devider"></div>
          <div class="bottombar_navItem bottombar_navItem--active">
            <img src="../assets/images/svg/filebtm.svg" alt="" />
          </div>
          <div class="bottombar_devider"></div>
          <div class="bottombar_navItem">
            <img src="../assets/images/svg/supportbtm.svg" alt="" />
          </div>
          <div class="bottombar_devider"></div>
          <div class="bottombar_navItem">
            <img src="../assets/images/svg/user.svg" alt="" />
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
