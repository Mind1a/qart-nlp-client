<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../styles/css/global.css" />
  </head>
  <body>
    <div class="layout">
      <div class="sidebar sidebar--collapsed">
        <div class="sidebar_header">
          <img
            class="sidebar_logoIcon"
            src="../assets/images/svg/MiniLogo.svg"
            alt="QartNLP"
          />
          <img
            class="sidebar_logoText"
            src="../assets/images/svg/LogoText.svg"
            alt="QartNLP"
          />
        </div>

        <div class="sidebar_divider"></div>

        <ul class="sidebar_nav">
          <li class="sidebar_navItem">
            <img
              class="sidebar_icon"
              src="../assets/images/svg/ProfileFileAdd.svg"
              alt=""
            />
            <span class="sidebar_label">ფაილის დამატება</span>
          </li>
          <li class="sidebar_navItem sidebar_navItem--active">
            <img
              class="sidebar_icon"
              src="../assets/images/svg/ProfileFiles.svg"
              alt=""
            />
            <span class="sidebar_label">ჩემი ფაილები</span>
          </li>
          <li class="sidebar_navItem">
            <img
              class="sidebar_icon"
              src="../assets/images/svg/Support.svg"
              alt=""
            />
            <span class="sidebar_label">კონტაქტი</span>
          </li>
        </ul>

        <div class="sidebar_footer">
          <div class="sidebar_avatar">ნ</div>
          <span class="sidebar_username">ნინი გოცირიძე</span>
        </div>
      </div>
      <div class="devider"></div>

      <main class="file-manager file-manager--table">
        <p class="file-manager__title">ჩემი ფაილები</p>

        <div class="file-manager__search">
          <img src=".././assets/images/svg/Search2.svg" alt="Search icon" />
          <input
            type="text"
            class="file-manager__search-input"
            placeholder="ძიება"
          />
        </div>

        <div class="file-manager__table-wrapper">
          <table class="file-manager__table">
            <thead>
              <tr>
                <th class="file-manager__th">სახელი</th>
                <th class="file-manager__th file-manager__th--center">
                  რედაქტირება
                </th>
                <th class="file-manager__th file-manager__th--center">
                  ჩამოტვირთვა
                </th>
                <th class="file-manager__th file-manager__th--center">წაშლა</th>
              </tr>
            </thead>
            <tbody>
              <tr class="file-manager__row">
                <td class="file-manager__td">
                  <span class="file-manager__file-icon">
                    <img src=".././assets/images/svg/File Text.svg" alt="" />
                  </span>
                  <span class="file-manager__file-name">ფაილის სახელი</span>
                </td>
                <td class="file-manager__td file-manager__td--center">
                  <button
                    class="file-manager__action-btn"
                    aria-label="რედაქტირება"
                  >
                    <img src=".././assets/images/svg/Edit.svg" alt="" />
                  </button>
                </td>
                <td class="file-manager__td file-manager__td--center">
                  <button
                    class="file-manager__action-btn"
                    aria-label="ჩამოტვირთვა"
                  >
                    <img src=".././assets/images/svg/Download.svg" alt="" />
                  </button>
                </td>
                <td class="file-manager__td file-manager__td--center">
                  <button
                    class="file-manager__action-btn file-manager__action-btn--delete"
                    aria-label="წაშლა"
                  >
                    <img src=".././assets/images/svg/DELETE.svg" alt="" />
                  </button>
                </td>
              </tr>
              <tr class="file-manager__row">
                <td class="file-manager__td">
                  <span class="file-manager__file-icon">
                    <img src=".././assets/images/svg/File Text.svg" alt="" />
                  </span>
                  <span class="file-manager__file-name">ფაილის სახელი</span>
                </td>
                <td class="file-manager__td file-manager__td--center">
                  <button
                    class="file-manager__action-btn"
                    aria-label="რედაქტირება"
                  >
                    <img src=".././assets/images/svg/Edit.svg" alt="" />
                  </button>
                </td>
                <td class="file-manager__td file-manager__td--center">
                  <button
                    class="file-manager__action-btn"
                    aria-label="ჩამოტვირთვა"
                  >
                    <img src=".././assets/images/svg/Download.svg" alt="" />
                  </button>
                </td>
                <td class="file-manager__td file-manager__td--center">
                  <button
                    class="file-manager__action-btn file-manager__action-btn--delete"
                    aria-label="წაშლა"
                  >
                    <img src=".././assets/images/svg/DELETE.svg" alt="" />
                  </button>
                </td>
              </tr>
            </tbody>
          </table>

          <nav class="file-manager__pagination">
            <a href="#" class="file-manager__page">1</a>
            <a href="#" class="file-manager__page file-manager__page--active"
              >2</a
            >
            <a href="#" class="file-manager__page">3</a>
            <a href="#" class="file-manager__page">4</a>
            <span class="file-manager__page file-manager__page--dots">...</span>
            <a
              href="#"
              class="file-manager__page file-manager__page--next"
              aria-label="შემდეგი"
              >›</a
            >
          </nav>
        </div>
      </main>

      <div class="botombar_box"></div>
      <div class="bottombar">
        <div class="bottombar_nav">
          <div class="bottombar_navItem">
            <img src="../assets/images/svg/fileaddbtm.svg" alt="" />
          </div>
          <div class="bottombar_devider"></div>
          <div class="bottombar_navItem bottombar_navItem--active">
            <img src="../assets/images/svg/filebtm.svg" alt="" />
          </div>
          <div class="bottombar_devider"></div>
          <div class="bottombar_navItem">
            <img src="../assets/images/svg/supportbtm.svg" alt="" />
          </div>
          <div class="bottombar_devider"></div>
          <div class="bottombar_navItem">
            <img src="../assets/images/svg/user.svg" alt="" />
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
